{
	"profiles": [
		{
			"name": "Map-to-Engine",
			"tasks": [
				{
					"target": "${WORK_DIR_PATH}Meshes/*",
					"type": "delete"
				},
				{
					"target": "${WORK_DIR_PATH}${MAP_BASE_NAME}.omwaddon",
					"type": "delete"
				},
				{
					"parameters": "compile --map \"${MAP_DIR_PATH}/${MAP_FULL_NAME}\" --scale 1.0 --output \"./${MAP_BASE_NAME}.omwaddon\"",
					"tool": "${Morrobroom}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"parameters": "--content=${MAP_BASE_NAME}.omwaddon --skip-menu=1 --start=${MAP_BASE_NAME} --script-run ${WORK_DIR_PATH}runscript.txt",
					"tool": "/usr/bin/openmw",
					"type": "tool"
				},
				{
					"enabled": false,
					"parameters": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.omwaddon",
					"tool": "${OpenCS}",
					"type": "tool"
				}
			],
			"workdir": "/home/sk3shun-8/.local/share/openmw/data/"
		}
	],
	"version": 1
}
